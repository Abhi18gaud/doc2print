name: Production Desktop Release & Auto-Updater Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Release Channel (stable or beta)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show version being released
        working-directory: desktop
        run: node -e "const p=require('./package.json'); console.log('Building version:', p.version)"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows Installer & Publish GitHub Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish always
