name: Production Desktop Release & Auto-Updater Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Release Channel (stable or beta)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Windows Installer & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd desktop
          npx electron-builder --win --publish always
